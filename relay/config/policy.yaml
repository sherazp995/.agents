version: 1
defaults:
  unmatched: ask
# FR-POL-4: this list cannot be overridden at runtime. Editing it requires a restart.
# The operator extends it during setup; it is never shipped empty.
hard_blocked_origins:
  - "*.chase.com"
  - "*.coinbase.com"
  - "console.aws.amazon.com"
  - "*.1password.com"
# FR-POL-7 spend caps in dollars, required by autonomous mode.
budget:
  run_cap_usd: 5
  session_cap_usd: 20
  principal_day_cap_usd: 50
# FR-APR-4 / FR-APR-5: who may approve at each risk tier, and whether
# approving needs the typed confirmation. `owner` also matches the legacy
# `operator` role. A tier left out here needs an owner (src/approvals/tier-policy.ts).
approvals:
  write:
    required_roles: [owner]
  sensitive:
    required_roles: [owner]
  irreversible:
    required_roles: [owner]
