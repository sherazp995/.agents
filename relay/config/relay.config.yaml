model_provider:
  name: anthropic
  zero_data_retention: true
database:
  url: keystore:relay-database-url
redis:
  url: redis://localhost:6379/13
logging:
  level: info
autonomous:
  # Every Slack conversation runs as an autonomous task: one thread is one
  # Claude Code chat, run without the sandbox.
  enabled: true
  # Each Slack turn may run this long before relay stops it (default 1 hour).
  # Long ticket work (builds, specs, video QA) was being cut off at the hour.
  turn_wall_clock_ms: 10800000 # 3 hours
ui:
  # The local setup page for projects, personas and teams. Log in with `relay ui`.
  enabled: true
  port: 7766
secrets:
  provider: keychain
slack:
  # Slackbot reminders that mention Relay start a read-only task here, run as
  # the owner below (README, "Reminders"). Anyone who can post in a listed
  # channel can set one, so list only channels you trust.
  reminders:
    - channel: C0CDW07KZ27 # cohabit-hassan
      act_as: U0BP0RW8FCH
    - channel: C0CE4CX137T # cohabit-zubair
      act_as: U0BP0RW8FCH
    - channel: C0CGAM76QBS # insitu-hassan
      act_as: U0BP0RW8FCH

# failover:
#   # Two laptops sharing one cloud database; only one answers Slack at a
#   # time (README, "Failover"). Each laptop names itself; the preferred one
#   # takes the record back when it returns.
#   host: hassan-mbp
#   preferred: true

# On for both laptops. Each laptop names itself (failover.host, and
# failover.preferred: true on the preferred one) in its own
# config/relay.local.yaml, which git ignores, so updates never conflict.
failover: {}

# relay claude / relay codex: whose DM gets a terminal chat thread when its folder has no project channel.
launcher:
  dm_to: U0BP0RW8FCH # Sheraz
