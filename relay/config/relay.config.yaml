model_provider:
  name: anthropic
  zero_data_retention: true
database:
  url: keystore:relay-database-url
  # Operator commands connect here; this Postgres trusts local connections, so no password is involved.
  operator_url: postgres://relay_app@localhost:5432/relay
redis:
  url: redis://localhost:6379/13
logging:
  level: info
autonomous:
  # Every Slack conversation runs as an autonomous task: one thread is one
  # Claude Code chat, run without the sandbox.
  enabled: true
ui:
  # The local setup page for projects, personas and teams. Log in with `relay ui`.
  enabled: true
  port: 7766
secrets:
  provider: keychain
slack:
  # Slackbot reminders that mention Relay start a read-only task here, run as
  # the owner below (README, "Reminders"). Anyone who can post in a listed
  # channel can set one, so list only channels you trust.
  reminders:
    - channel: C0CDW07KZ27 # cohabit-hassan
      act_as: U0BP0RW8FCH
    - channel: C0CE4CX137T # cohabit-zubair
      act_as: U0BP0RW8FCH
    - channel: C0CGAM76QBS # insitu-hassan
      act_as: U0BP0RW8FCH
