# Relay Slack app manifest.
#
# Paste this into api.slack.com/apps when creating the app "from a manifest".
# It encodes exactly the scopes the code declares in SLACK_BOT_SCOPES, so the
# scopes granted at install time match what `relay doctor` expects. Editing
# the scope list here without editing the code will make the doctor's
# slack-scopes check fail, which is the intended behaviour.
#
# Deliberately absent: search:read and users:read.email, and every other
# workspace wide read scope. Relay sees only the channels it is invited to
# plus its own DMs, per FR-SLA-5.

display_information:
  name: Relay
  description: Chat driven computer use agent
  background_color: "#2c2d30"

features:
  bot_user:
    display_name: Relay
    always_online: false
  # Without this block Slack defaults the Messages tab to read only, which
  # shows "Sending messages to this app has been turned off" and makes DMs to
  # the bot impossible. The bot can still post to you, so the failure looks
  # like a one way channel rather than a settings problem.
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  # No slash commands: Slack gives each command name to one app per
  # workspace, so two Relays would take each other's. "sessions" and
  # "direct" are plain messages to Relay instead.

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
      - channels:history
      - groups:history
      - channels:read
      - groups:read
      - files:read
      - files:write
      - reactions:read
      - reactions:write

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
